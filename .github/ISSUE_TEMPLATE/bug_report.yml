name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill this out completely — it helps reproduce and fix the issue faster.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Start server with `bun run src/index.ts`
        2. Call `browser_navigate` with URL ...
        3. Observe error
    validations:
      required: true
  - type: input
    id: bun-version
    attributes:
      label: Bun version
      description: Run `bun --version`
      placeholder: '1.3.11'
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: macOS / Linux / distribution
      placeholder: macOS 15.0 (arm64)
    validations:
      required: true
  - type: input
    id: fallback
    attributes:
      label: FALLBACK_BROWSER
      description: Value of FALLBACK_BROWSER (none, headless, headful, browserbase, browserless)
      placeholder: 'none'
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste server logs from `logs/` directory or terminal output.
      render: text
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Any non-default env vars or CLI flags you're using.
      render: text
      placeholder: |
        FALLBACK_BROWSER=headful
        PROXY_SERVER=http://proxy:8080
