name: Feature Request
description: Propose a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. The more context you provide, the easier it is to evaluate.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? What's the use case?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Be specific — new tool, config option, behavior change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you've tried or alternative approaches you've thought about.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, screenshots, references to similar tools, etc.
